version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: busreservation-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bus_reservation_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    networks:
      - busnet

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: busreservation-app
    restart: always
    depends_on:
      - db
    environment:
      DB_URL: jdbc:mysql://db:3306/bus_reservation_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "8080:8080"
    networks:
      - busnet

volumes:
  mysql_data:

networks:
  busnet:
    driver: bridge

