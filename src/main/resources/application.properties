# Bus Reservation Management System - Application Configuration

# Database Connection Settings
# Can be overridden via environment variables: DB_URL, DB_USER, DB_PASSWORD
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/bus_reservation_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
db.username=root
db.password=root

# Connection Pool (HikariCP)
hikari.maximumPoolSize=10
hikari.minimumIdle=3
hikari.idleTimeout=300000
hikari.connectionTimeout=20000
hikari.maxLifetime=1200000

# Hibernate ORM Settings
hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
hibernate.show_sql=false
hibernate.format_sql=true
hibernate.hbm2ddl.auto=update
hibernate.default_schema=bus_reservation_db

# Application Settings
app.name=VoyageBus Express
app.currency.symbol=INR
app.support.phone=+91 1800 200 4567
app.support.email=support@voyagebus.com
